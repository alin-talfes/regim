name: Validate operational upgrades

on:
  push:
    branches: [tmp-operational-upgrades]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
