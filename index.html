<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#012369" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="REGIM" />
    <meta name="description" content="Evidența expirării perioadei de carantină" />
    <link rel="manifest" href="/regim/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/regim/icons/icon-180.png" />
    <title>REGIM</title>
    <style>
      html,body{margin:0;min-height:100%;background:#f3f6fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10213a}
      .boot-fallback{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
      .boot-fallback-card{max-width:360px}
      .boot-fallback strong{display:block;color:#012369;font-size:20px;margin-bottom:6px}
      .boot-fallback span{font-size:14px;color:#647180;line-height:1.45}
      .boot-reload{margin-top:14px;min-height:44px;border:0;border-radius:10px;padding:0 16px;background:#155a9b;color:#fff;font:inherit;font-weight:700}
    </style>
  </head>
  <body>
    <div id="app">
      <main class="boot-fallback"><div class="boot-fallback-card"><strong>REGIM</strong><span>Se încarcă aplicația…</span></div></main>
    </div>
    <noscript><div class="boot-fallback"><div class="boot-fallback-card"><strong>JavaScript este dezactivat</strong><span>REGIM necesită JavaScript pentru autentificare și acces la evidență.</span></div></div></noscript>
    <script>
      window.setTimeout(function () {
        if (document.documentElement.dataset.regimReady === '1') return;
        var app = document.getElementById('app');
        if (!app) return;
        app.innerHTML = '<main class="boot-fallback"><div class="boot-fallback-card"><strong>Aplicația nu s-a încărcat</strong><span>Reîncarcă pagina. Dacă problema persistă, închide complet browserul și redeschide REGIM.</span><br><button class="boot-reload" type="button" onclick="location.reload()">Reîncarcă</button></div></main>';
      }, 7000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
